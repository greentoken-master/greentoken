<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 72" role="img" aria-label="GreenToken">
  <title>GreenToken</title>

  <!-- ── ICON: hexagon + leaf ── -->
  <g transform="translate(4, 4)">
    <!-- Outer hexagon (token shape) -->
    <polygon
      points="32,2 58,17 58,47 32,62 6,47 6,17"
      fill="none"
      stroke="#16a34a"
      stroke-width="2"
      stroke-linejoin="round"
    />
    <!-- Inner hex accent (blockchain layers) -->
    <polygon
      points="32,12 48,22 48,42 32,52 16,42 16,22"
      fill="rgba(22,163,74,0.07)"
      stroke="rgba(22,163,74,0.25)"
      stroke-width="1"
      stroke-linejoin="round"
    />
    <!-- Leaf: curved teardrop pointing up -->
    <path
      d="M32 48 C24 40 20 32 20 26 C20 19 25 15 32 15 C39 15 44 19 44 26 C44 32 40 40 32 48 Z"
      fill="#16a34a"
    />
    <!-- Leaf center vein -->
    <line x1="32" y1="48" x2="32" y2="20" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Left vein -->
    <line x1="32" y1="34" x2="25" y2="27" stroke="#ffffff" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
    <!-- Right vein -->
    <line x1="32" y1="34" x2="39" y2="27" stroke="#ffffff" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- ── DIVIDER ── -->
  <line x1="80" y1="14" x2="80" y2="58" stroke="#CBD5E1" stroke-width="1"/>

  <!-- ── WORDMARK ── -->
  <text
    x="96" y="46"
    font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif"
    font-weight="600"
    font-size="34"
    fill="#0F172A"
    letter-spacing="-0.8">GreenToken</text>
</svg>
